<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Crear contraseña | LN Studio</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="dashboard.css">
  <style>
    body.password-page{min-height:100vh;margin:0;display:grid;place-items:center;background:#f5f2eb;color:#171717;padding:24px;font-family:Inter,system-ui,sans-serif}
    .password-shell{width:min(100%,520px);background:#fff;border:1px solid #ded8ca;border-radius:24px;padding:34px;box-shadow:0 24px 80px rgba(20,18,13,.12)}
    .password-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.password-brand img{width:54px;height:54px;object-fit:contain}.password-brand strong{font-family:Georgia,serif;font-size:1.35rem}.password-brand small{display:block;color:#6a6255;text-transform:uppercase;letter-spacing:.16em;font-size:.65rem;margin-top:3px}
    .password-kicker{font-size:.72rem;text-transform:uppercase;letter-spacing:.2em;color:#9b6b13;font-weight:800}.password-shell h1{font:700 clamp(2rem,7vw,3.4rem)/1 Georgia,serif;margin:.55rem 0 1rem}.password-copy{color:#655f55;line-height:1.65;margin-bottom:24px}
    .password-form{display:grid;gap:16px}.password-form label{display:grid;gap:8px;font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.password-form input{width:100%;box-sizing:border-box;padding:15px 16px;border:1px solid #cbc3b4;border-radius:12px;background:#fff;font:inherit;color:#171717}.password-form input:focus{outline:3px solid rgba(199,151,53,.2);border-color:#9b6b13}.password-form button{border:0;border-radius:12px;padding:16px;background:#171717;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}.password-form button:disabled{opacity:.55;cursor:wait}.password-status{min-height:24px;margin:0;color:#7b1e26;line-height:1.45}.password-status[data-success="true"]{color:#137333}.password-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.password-actions a{display:inline-flex;text-decoration:none;padding:12px 16px;border:1px solid #c8bfae;border-radius:10px;color:#171717;font-weight:700}.password-help{font-size:.82rem;color:#786f62;margin-top:22px;line-height:1.55}
  </style>
</head>
<body class="password-page">
  <main class="password-shell">
    <div class="password-brand"><img src="logo.png" alt="LN Studio"><div><strong>LN Studio</strong><small>Acceso privado</small></div></div>
    <p class="password-kicker">Invitación de acceso</p>
    <h1>Crea tu contraseña</h1>
    <p class="password-copy" data-copy>Estamos validando el enlace que LN Studio envió a tu correo.</p>

    <form class="password-form" id="password-form" hidden>
      <label>Nueva contraseña
        <input name="password" type="password" minlength="8" autocomplete="new-password" required placeholder="Mínimo 8 caracteres">
      </label>
      <label>Confirmar contraseña
        <input name="confirmation" type="password" minlength="8" autocomplete="new-password" required>
      </label>
      <button type="submit">Guardar contraseña y entrar</button>
    </form>

    <p class="password-status" data-status role="status"></p>
    <div class="password-actions" data-actions hidden>
      <a href="admin.html">Entrar al panel</a>
    </div>
    <p class="password-help">Este enlace es personal. No lo compartas. Tu cuenta solo podrá consultar los eventos que LN Studio haya asignado a tu correo.</p>
  </main>
  <script type="module" src="crear-contrasena.js"></script>
</body>
</html>
