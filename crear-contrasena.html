<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Crear contraseña | LN Studio</title>
  <link rel="icon" href="favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css?v=4.4.4">
  <style>
    body.password-page{min-height:100svh;margin:0;display:grid;place-items:center;padding:22px;font-family:"Manrope",Inter,system-ui,sans-serif}
    .password-shell{width:min(100%,520px);background:#fff;padding:32px}
    .password-brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.password-brand img{width:52px;height:52px;object-fit:contain}.password-brand strong{font-size:1.25rem}.password-brand small{display:block;color:#737b8d;text-transform:uppercase;letter-spacing:.14em;font-size:.62rem;margin-top:2px}
    .password-kicker{font-size:.7rem;text-transform:uppercase;letter-spacing:.16em;color:#7357e7;font-weight:800}.password-copy{color:#646c80;line-height:1.65;margin-bottom:23px}
    .password-form{display:grid;gap:15px}.password-form label{display:grid;gap:8px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#5f6679}.password-form input{width:100%;box-sizing:border-box;padding:14px 15px;border:1px solid #dce1ec;border-radius:11px;background:#fafbfe;font:inherit;color:#222433}.password-form input:focus{outline:0;border-color:#7357e7;box-shadow:0 0 0 4px rgba(115,87,231,.1)}.password-form button{border:0;border-radius:11px;padding:15px;background:#7357e7;color:#fff;font-weight:800;font-size:.96rem;cursor:pointer}.password-form button:disabled{opacity:.55;cursor:wait}.password-status{min-height:24px;margin:0;color:#c33c50;line-height:1.45}.password-status[data-success="true"]{color:#17825b}.password-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.password-actions a{display:inline-flex;text-decoration:none;padding:12px 16px;border-radius:10px;background:#7357e7;color:#fff;font-weight:800}.password-help{font-size:.8rem;color:#747c8f;margin-top:20px;line-height:1.55}
  </style>
</head>
<body class="password-page">
  <main class="password-shell">
    <div class="password-brand"><img src="logo.png" alt="LN Studio"><div><strong>LN Studio</strong><small>Acceso privado</small></div></div>
    <p class="password-kicker">Invitación de acceso</p>
    <h1>Crea tu contraseña</h1>
    <p class="password-copy" data-copy>Estamos validando el enlace que LN Studio envió a tu correo.</p>

    <form class="password-form" id="password-form" hidden>
      <label>Nueva contraseña
        <input name="password" type="password" minlength="8" autocomplete="new-password" required placeholder="Mínimo 8 caracteres">
      </label>
      <label>Confirmar contraseña
        <input name="confirmation" type="password" minlength="8" autocomplete="new-password" required>
      </label>
      <button type="submit">Guardar contraseña y entrar</button>
    </form>

    <p class="password-status" data-status role="status"></p>
    <div class="password-actions" data-actions hidden>
      <a href="admin.html">Entrar al panel</a>
    </div>
    <p class="password-help">Este enlace es personal. No lo compartas. Tu cuenta solo podrá consultar los eventos que LN Studio haya asignado a tu correo.</p>
  </main>
  <script type="module" src="crear-contrasena.js?v=4.4.4"></script>
</body>
</html>
