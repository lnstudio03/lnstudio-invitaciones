<!doctype html>
<html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Escáner QR | LN Studio</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="dashboard.css"><script type="module" src="scanner.js"></script></head>
<body><main class="scanner-shell">
<header class="admin-header"><div class="admin-brand"><img src="logo.png" alt=""><div><span>LN Studio</span><small>Control de acceso</small></div></div><div class="admin-header-actions"><a class="ghost-button" href="admin.html">Dashboard</a><button type="button" class="ghost-button" data-stop-camera hidden>Detener cámara</button></div></header>
<section class="scanner-card"><p class="admin-eyebrow">Escáner seguro</p><h1>Validar pase QR</h1>
<label>Evento<select data-event-select><option value="">Selecciona un evento</option></select></label>
<div class="camera-box" data-camera-box><video data-video playsinline muted hidden></video><div class="camera-placeholder" data-camera-placeholder>Activa la cámara o pega el token manualmente.</div></div>
<button type="button" class="primary-button" data-start-camera>Activar cámara</button>
<form id="manual-form" class="login-form" action="#" onsubmit="return false;"><label>Token o enlace<input name="token" placeholder="Pega el código manualmente" autocomplete="off"></label><button type="submit">Consultar pase</button></form>
<div class="scan-result" data-result hidden><p class="admin-eyebrow" data-result-state></p><h2 data-result-title></h2><p data-result-message></p><dl><div><dt>Folio</dt><dd data-folio></dd></div><div><dt>Disponibles</dt><dd data-remaining></dd></div><div><dt>Evento</dt><dd data-event-name></dd></div><div><dt>Teléfono</dt><dd data-phone></dd></div></dl><label>Personas que ingresan ahora<input data-entries type="number" min="1" value="1"></label><label>Motivo / nota<input data-reason placeholder="Opcional"></label><div class="intro-actions"><button type="button" data-approve>Aprobar acceso</button><button type="button" class="ghost-button" data-reject>Rechazar</button></div></div><p id="scan-status" class="form-status" role="status"></p>
</section></main></body></html>
